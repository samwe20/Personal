name: FAST Manager Windows build
on:
  push:
    paths: ["fast-manager/**", ".github/workflows/fast-manager.yml"]
  pull_request:
    paths: ["fast-manager/**", ".github/workflows/fast-manager.yml"]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fast-manager/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fast-manager/app/package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fast-manager/app/src-tauri
          cache-on-failure: true
      - name: Build Windows .exe + installers
        run: npx tauri build
      - name: Prepare versioned portable exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/fast-manager.exe "src-tauri/target/release/FAST-Manager-$version.exe"
          "FAST_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: fast-manager-windows
          path: |
            fast-manager/app/src-tauri/target/release/FAST-Manager-*.exe
            fast-manager/app/src-tauri/target/release/bundle/nsis/*.exe
            fast-manager/app/src-tauri/target/release/bundle/msi/*.msi
      - name: Attach installers to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fast-manager/app/src-tauri/target/release/FAST-Manager-*.exe
            fast-manager/app/src-tauri/target/release/bundle/nsis/*.exe
            fast-manager/app/src-tauri/target/release/bundle/msi/*.msi
      - name: Publish rolling "latest" build
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          generate_release_notes: false
          files: |
            fast-manager/app/src-tauri/target/release/FAST-Manager-*.exe
            fast-manager/app/src-tauri/target/release/bundle/nsis/*.exe
            fast-manager/app/src-tauri/target/release/bundle/msi/*.msi
