name: Folio checks
on:
  push:
    paths: ["folio/**", ".github/workflows/folio.yml"]
  pull_request:
    paths: ["folio/**", ".github/workflows/folio.yml"]
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: folio/package-lock.json
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: folio/src-tauri
      - name: Build Windows application and installer
        run: npm run desktop:build -- --bundles nsis
      - name: Install Folio and its WebView2 prerequisite
        shell: pwsh
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $installDirectory = Join-Path $env:RUNNER_TEMP 'Folio Installed'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDirectory" -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          $executable = Join-Path $installDirectory 'folio.exe'
          if (!(Test-Path -LiteralPath $executable)) { throw 'Installed executable is missing' }
          if ((Get-FileHash $executable).Hash -ne (Get-FileHash src-tauri/target/release/folio.exe).Hash) { throw 'Installed executable differs from the release build' }
          "FOLIO_DESKTOP_EXE=$executable" >> $env:GITHUB_ENV
      - name: Test the actual Windows application
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-windows
          path: |
            folio/src-tauri/target/release/folio.exe
            folio/src-tauri/target/release/bundle/nsis/*.exe
            folio/test-results/desktop/*.png
            folio/test-results/desktop/*.json
            folio/test-results/desktop/*.html
            folio/test-results/desktop/*.log
  web:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: folio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: folio-browser-results
          path: folio/test-results
