name: Folio checks
on:
  push:
    paths: ["folio/**", ".github/workflows/folio.yml"]
  pull_request:
    paths: ["folio/**", ".github/workflows/folio.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: folio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: folio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: folio-browser-results
          path: folio/test-results
