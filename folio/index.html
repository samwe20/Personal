<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f3f4f3" />
    <title>Folio</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app" class="app sidebar-collapsed" data-theme="light">
      <div class="scrim hidden" id="scrim" aria-hidden="true"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-copy">
            <span class="brand-name">Folio</span>
            <span class="brand-tag">Library</span>
          </div>
          <button class="icon-btn mobile-only" id="btn-close-sidebar" title="Zavřít" aria-label="Zavřít knihovnu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="sidebar-actions">
          <button class="icon-btn" id="btn-new-note" title="Nová poznámka" aria-label="Nová poznámka">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn" id="btn-open-library" title="Otevřít knihovnu" aria-label="Otevřít knihovnu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3V7z"/></svg>
          </button>
          <button class="icon-btn" id="btn-refresh" title="Obnovit" aria-label="Obnovit knihovnu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>

        <div class="disk-actions web-only hidden" id="disk-actions">
          <button class="disk-btn" id="btn-export-library" type="button">Export ZIP</button>
          <button class="disk-btn" id="btn-export-note" type="button">Export .md</button>
          <button class="disk-btn" id="btn-import-files" type="button">Import .md</button>
          <button class="disk-btn desktop-chromium" id="btn-save-folder" type="button">Uložit do složky</button>
          <input id="import-files" class="hidden" type="file" accept=".md,text/markdown,text/plain" multiple />
        </div>

        <div class="library-path" id="library-path" title="">Žádná knihovna</div>
        <div class="note-list" id="note-list" role="list"></div>
      </aside>

      <div class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <button class="ghost-btn" id="btn-toggle-sidebar" title="Knihovna" aria-label="Knihovna">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
            </button>
            <input class="title-input" id="note-title" placeholder="Bez názvu" spellcheck="false" enterkeyhint="done" />
          </div>
          <div class="toolbar-right">
            <div class="font-picker" title="Font editoru">
              <span class="font-picker-label">Font</span>
              <button type="button" class="font-select" id="font-select" aria-haspopup="listbox" aria-expanded="false" aria-label="Font editoru">
                <span id="font-select-label">Literata</span>
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="font-menu hidden" id="font-menu" role="listbox"></div>
            </div>
            <button class="chip-btn desktop-only" id="btn-focus" data-active="false" title="Focus Mode — fullscreen, typewriter, bez UI">Focus</button>
            <button class="chip-btn desktop-only" id="btn-typewriter" data-active="false" title="Typewriter">Typewriter</button>
            <button class="chip-btn" id="btn-preview" data-active="false" title="Náhled">Preview</button>
            <button class="chip-btn" id="btn-theme" title="Přepnout motiv">Dark</button>
            <button class="chip-btn" id="btn-backlinks" data-active="false" title="Backlinky">Links</button>
          </div>
        </header>

        <div class="stage">
          <main class="editor-pane">
            <div id="editor-root" class="editor-root"></div>
            <article id="preview-root" class="preview-root hidden"></article>
          </main>

          <aside class="backlinks-pane" id="backlinks-pane">
            <div class="sheet-handle mobile-only" aria-hidden="true"></div>
            <div class="backlinks-header">
              <h2>Backlinky</h2>
              <span class="backlinks-count" id="backlinks-count">0</span>
              <button class="icon-btn mobile-only" id="btn-close-backlinks" title="Zavřít" aria-label="Zavřít backlinky">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
            <p class="backlinks-hint">Poznámky, které odkazují sem přes <code>[[…]]</code>.</p>
            <div class="backlinks-list" id="backlinks-list"></div>
            <div class="outgoing-header">
              <h3>Odchozí odkazy</h3>
            </div>
            <div class="outgoing-list" id="outgoing-list"></div>
          </aside>
        </div>

        <footer class="status-bar">
          <span id="status-words">0 slov</span>
          <span class="dot" aria-hidden="true"></span>
          <span id="status-chars">0 znaků</span>
          <span class="dot desktop-only" aria-hidden="true"></span>
          <span id="status-save">Připraveno</span>
          <span class="spacer"></span>
          <span id="status-hint" class="desktop-only">[[odkaz]] bez závorek · dvojklik otevře · Ctrl+N nová · Ctrl+P otevření</span>
        </footer>
      </div>

      <button type="button" class="focus-exit-btn hidden" id="btn-exit-focus" title="Opustit Focus (Esc)" aria-label="Opustit Focus Mode">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>Opustit Focus</span>
      </button>

      <div class="command-palette hidden" id="command-palette" role="dialog" aria-modal="true">
        <div class="command-card">
          <input id="command-input" class="command-input" placeholder="Otevřít poznámku…" autocomplete="off" spellcheck="false" />
          <div id="command-results" class="command-results"></div>
        </div>
      </div>

      <div class="welcome hidden" id="welcome">
        <div class="welcome-card">
          <div class="brand-mark large" aria-hidden="true"></div>
          <h1>Folio</h1>
          <p id="welcome-copy">Soustředěné psaní ve stylu iA Writer — s propojenými poznámkami jako v Obsidianu.</p>
          <div class="welcome-actions">
            <button class="primary-btn" id="welcome-demo">Začít s ukázkovou knihovnou</button>
            <button class="ghost-btn solid" id="welcome-open">Otevřít jinou složku</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
